[package]
name = "maja-capinfo"
version = "0.3.1"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "A CLI tool to print information about capture files."
readme = "README.md"
categories = ["command-line-utilities"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
indicatif = { workspace = true }
indicatif-log-bridge = { workspace = true }
maja = { workspace = true, features = ["serde"] }
polars = { version = "0.55.2", default-features = false, features = [
    "performant",
    "csv",
    "parquet",
    "dtype-u8",
    "dtype-u16",
    "dtype-u128",
] }
temporal_rs = { workspace = true }
human_format = "1.2.1"
tempfile = { workspace = true }
itertools = "0.15.0"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1.4"
yaml_serde = "0.10.7"
sha2 = "0.11.0"
sha1 = "0.11.0"
md-5 = "0.11.0"
base16ct = { version = "1.0.0", features = ["alloc"] }
